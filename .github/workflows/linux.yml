name: Linux build and distribution
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check Linux scripts
        run: |
          bash -n run.sh
          bash -n scripts/package-linux.sh
          shellcheck run.sh scripts/package-linux.sh
      - name: Test and build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Test real PTYs and package Java
        run: mvn -B clean package
      - name: Assemble distribution
        run: bash scripts/package-linux.sh
      - name: Smoke-test extracted distribution
        shell: bash
        run: |
          cd dist
          sha256sum -c p-dash-linux.tar.gz.sha256
          install_dir=$(mktemp -d)
          tar -xzf p-dash-linux.tar.gz -C "$install_dir"
          cd "$install_dir"
          export PDASH_DATA="$install_dir/state"
          export PDASH_PORT=14310
          bash run.sh --no-build --no-browser > server.log 2>&1 &
          server_pid=$!
          trap 'kill -TERM "$server_pid" 2>/dev/null || true; wait "$server_pid" || true' EXIT
          ready=false
          for attempt in {1..120}; do
            if curl --fail --silent http://127.0.0.1:14310/ > index.html; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat server.log; exit 1; fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then cat server.log; exit 1; fi
          grep -q '<div id="root"' index.html
          if [[ ! -s "$PDASH_DATA/auth/token" ]]; then
            echo 'Startup did not create the bearer token.' >&2
            cat server.log
            exit 1
          fi
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $(cat "$PDASH_DATA/auth/token")" \
            http://127.0.0.1:14310/api/status | jq -e '.commands | type == "array"'
          kill -TERM "$server_pid"
          result=0
          wait "$server_pid" || result=$?
          [[ "$result" == 0 || "$result" == 143 ]]
          trap - EXIT
      - uses: actions/upload-artifact@v4
        with:
          name: p-dash-linux
          path: dist/p-dash-linux.tar.gz*
          if-no-files-found: error
