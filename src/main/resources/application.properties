quarkus.http.host=127.0.0.1
quarkus.http.port=${PDASH_PORT:4310}
quarkus.http.test-port=0
quarkus.http.limits.max-body-size=4M
quarkus.http.static-resources.caching-enabled=false
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://127.0.0.1:${quarkus.http.port},http://localhost:${quarkus.http.port}
quarkus.http.cors.headers=Authorization,Content-Type,Accept,Mcp-Session-Id,MCP-Protocol-Version,Last-Event-ID
quarkus.http.cors.exposed-headers=Mcp-Session-Id,MCP-Protocol-Version
quarkus.jackson.serialization-inclusion=non-null
quarkus.mcp.server.server-info.name=p-dash
quarkus.mcp.server.server-info.version=2.0.0
quarkus.mcp.server.http.root-path=/mcp
quarkus.log.category."com.pty4j".level=WARN
pdash.data=${PDASH_DATA:.pdash}
pdash.owner-pid=${PDASH_OWNER_PID:0}
pdash.open-browser=${PDASH_OPEN_BROWSER:false}
pdash.demo.enabled=true
%test.pdash.data=target/test-state
%test.pdash.demo.enabled=false
